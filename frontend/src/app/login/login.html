<main class="grow flex flex-col lg:flex-row w-full h-full min-h-screen">

  <!-- Left Side: Image -->
  <section class="relative flex-none h-64 lg:h-auto lg:w-5/12 xl:w-1/2 flex-col justify-between p-8 lg:p-12 overflow-hidden bg-surface-container-high hidden lg:flex">
    <div class="absolute inset-0 z-0">
      <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNgBDDAXbQ2kvOLA6cI1oZExpJCyAWBky_47ZofnuZea2ACxOS0t9c0fsZf3RYkNbfCYMTTAXzKVx1AnD39Rw4Ar3Nbh1vf80rIAdnZifq_veqT05MY3Ub55PZjINKgtvNyfuAyw7GcQUw4gWyN_LsjwN_Z1tVCMP_SoH8BGbKO9hMcIp1M8pKvVnanyqa_i-XXW0iLhSJszcsxYx0N3crfj3nmkLM-d7rvnJo3Tdrf5fC5ba9x4Wdr2f6rGQCDFwhef0C-FiI5Lzg" class="w-full h-full object-cover" />
      <div class="absolute inset-0 bg-linear-to-t from-black/80 via-black/30 to-black/40"></div>
    </div>
    <div class="relative z-10 flex flex-col gap-sm lg:gap-md mt-auto justify-end">
      <span class="font-label-caps text-label-caps text-primary-fixed uppercase tracking-wider hidden lg:block">Professional Explorer Platform</span>
      <h1 class="font-display-lg text-display-lg text-on-primary">
        Plan complex routes.<br/>Log every detail.
      </h1>
    </div>
  </section>

  <!-- Right Side: Form -->
  <section class="grow flex flex-col w-full lg:w-7/12 xl:w-1/2 bg-surface">
    <app-header></app-header>

    <div class="grow flex items-center justify-center p-6 lg:p-16">
      <div class="w-full max-w-md">
        
        <div class="mb-8">
          <h2 class="font-headline-md text-headline-md text-on-surface mb-6">
            {{ isLoginMode ? 'Welcome Back' : 'Start Your Journey' }}
          </h2>
          <div class="flex border-b border-outline-variant">
            <button 
              (click)="setMode(true)"
              class="flex-1 pb-3 text-center font-title-sm text-title-sm transition-colors"
              [class]="isLoginMode ? 'border-b-2 border-primary text-primary' : 'border-b-2 border-transparent text-on-surface-variant hover:text-on-surface'">
              Log In
            </button>
            <button 
              (click)="setMode(false)"
              class="flex-1 pb-3 text-center font-title-sm text-title-sm transition-colors"
              [class]="!isLoginMode ? 'border-b-2 border-primary text-primary' : 'border-b-2 border-transparent text-on-surface-variant hover:text-on-surface'">
              Join Now
            </button>
          </div>
        </div>

        <!-- API Error Banner -->
        @if (apiErrorMessage) {
          <div class="mb-6 p-4 rounded-lg bg-error-container text-on-error-container flex items-center gap-2">
            <span class="material-symbols-outlined">error</span>
            <span class="font-body-sm text-body-sm">{{ apiErrorMessage }}</span>
          </div>
        }

        <!-- LOGIN FORMULAR -->
        @if (isLoginMode) {
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6" novalidate>
            <app-input 
              label="Username" 
              icon="person" 
              placeholder="Enter your username" 
              formControlName="username"
              [control]="loginForm.get('username')"
              errorMessage="Username is required.">
            </app-input>

            <app-input 
              label="Password" 
              type="password" 
              icon="lock" 
              [showForgot]="true"
              placeholder="Enter your password" 
              formControlName="password"
              [control]="loginForm.get('password')"
              errorMessage="Password is required.">
            </app-input>

            <div class="pt-2">
              <app-button type="submit" label="Access Dashboard" variant="primary" trailingIcon="arrow_forward" [disabled]="loginForm.invalid"></app-button>
            </div>
          </form>
        } 
        <!-- REGISTER FORMULAR -->
        @else {
          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6" novalidate>
            <app-input 
              label="Username" 
              icon="person" 
              placeholder="Choose a username" 
              formControlName="username"
              [control]="registerForm.get('username')"
              errorMessage="Username is required.">
            </app-input>

            <app-input 
              label="Email Address" 
              type="email" 
              icon="mail" 
              placeholder="explorer@pathfinder.com" 
              formControlName="email"
              [control]="registerForm.get('email')"
              errorMessage="Please enter a valid email.">
            </app-input>

            <app-input 
              label="Password" 
              type="password" 
              icon="lock" 
              placeholder="Min. 6 characters" 
              formControlName="password"
              [control]="registerForm.get('password')"
              errorMessage="Password must be at least 6 characters.">
            </app-input>

            <app-input 
              label="Repeat Password" 
              type="password" 
              icon="lock" 
              placeholder="Confirm your password" 
              formControlName="passwordRepeat"
              [control]="registerForm.get('passwordRepeat')"
              errorMessage="Passwords do not match.">
            </app-input>

            <div class="pt-2">
              <app-button type="submit" label="Create Account" variant="primary" trailingIcon="person_add" [disabled]="registerForm.invalid"></app-button>
            </div>
          </form>
        }
      </div>
    </div>

    <app-footer></app-footer>
  </section>
</main>
