<ul class="flex-1 py-4 flex flex-col gap-1">
  
  @for (item of navItems; track item.path) {
    <li>
      <a 
        [routerLink]="item.path"
        
        #rla="routerLinkActive"
        routerLinkActive="bg-surface-container-high text-primary border-r-4 border-primary font-bold"
        [routerLinkActiveOptions]="{exact: true}"
        
        class="flex items-center gap-3 px-6 py-3 cursor-pointer text-on-surface-variant hover:bg-surface-container-low transition-all duration-200">
        
        <span class="material-symbols-outlined" 
              [style.font-variation-settings]="rla.isActive ? '\'FILL\' 1' : '\'FILL\' 0'">
          {{ item.icon }}
        </span>
        
        {{ item.label }}
      </a>
    </li>
  }
  
</ul>
